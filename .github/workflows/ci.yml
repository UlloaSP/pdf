name: Validate Windows app
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect native changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $native = 'true'
          if ($env:BASE_SHA) {
            $changed = git diff --name-only $env:BASE_SHA $env:HEAD_SHA
            if (-not ($changed -match '^(src-tauri/|package|pnpm-|vite.config|scripts/|\.github/)')) { $native = 'false' }
          }
          "CHECK_NATIVE=$native" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          version: "0.3.0"
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        if: env.CHECK_NATIVE == 'true'
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        if: env.CHECK_NATIVE == 'true'
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: python -m pip install -r engine/requirements.txt
      - run: python -m unittest discover -s engine/tests
      - run: python scripts/build-engine.py
      - run: python scripts/smoke-engine.py
      - run: vp run check
      - run: vp run test
      - run: vp run test:updater-manifest
      - run: vp run check:version
      - run: vp run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        if: env.CHECK_NATIVE == 'true'
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
        if: env.CHECK_NATIVE == 'true'
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        if: env.CHECK_NATIVE == 'true'
      - run: vp run desktop:build
        if: env.CHECK_NATIVE == 'true'
      - uses: actions/upload-artifact@v4
        if: env.CHECK_NATIVE == 'true'
        with:
          name: pdf-utils-windows-x64-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

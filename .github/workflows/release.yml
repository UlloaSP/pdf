name: Release Windows MSI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          version: "0.3.0"
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: python -m pip install -r engine/requirements.txt
      - run: python -m unittest discover -s engine/tests
      - run: python scripts/build-engine.py
      - run: python scripts/smoke-engine.py
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run check:version
      - run: vp run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: vp run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-utils-windows-x64-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdf-utils-windows-x64-msi
          path: bundles
      - name: Publish MSI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "PDF Utils $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" bundles/*.msi --clobber
          gh release edit "$RELEASE_TAG" --draft=false
